# SDD configuration — dashboard-grid
# Generated by sdd-init (hybrid mode: openspec + Engram), 2026-08-10.
schema: spec-driven

context: |
  Stack: static HTML5 + CSS3 vanilla (BEM) + Alpine.js 3.x (CDN) + Feather icons (CDN). No package.json, no build tooling, no tests.
  Architecture: single-page admin dashboard; CSS custom properties in :root act as design tokens; CSS Grid layout (header/content/footer).
  Conventions: BEM naming (header__title, dropdown-wrapper__content), CSS custom properties, Spanish UI copy, Spanish loosely-conventional commits, branch develop.
  Change in flight: modernize into a static design system with Tailwind CSS v4 (tokens, own identity colors, WCAG contrast, portable to Next.js/Vue later).
  Preflight: execution_mode=interactive, artifact_store.mode=both, delivery_strategy=ask-always, review_budget_lines=400.

# Strict TDD marker resolved at init: no test runner exists -> false.
strict_tdd: false

testing:
  strict_tdd: false
  reason: No test runner exists (no package.json, no build tooling, no CI). Strict TDD unavailable until tooling is added.
  test_command: ""
  runner: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  possible_later:
    - "Playwright + @axe-core/playwright: E2E + WCAG/a11y checks (recommended, aligns with design-system change)"
    - "Nu Html Checker: static markup validation"
    - "Lighthouse: accessibility/performance audit"

rules:
  proposal:
    - Keep the change scoped to a static design system; no runtime JS framework added in this change
    - Include rollback plan: the static site must remain servable without the Tailwind v4 build
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Scenarios must cover WCAG 2.x contrast requirements and responsive breakpoints
  design:
    - Make the Tailwind v4 build strategy explicit (buildless option vs @tailwindcss/cli)
    - Document token mapping from current :root custom properties to Tailwind design tokens
    - Keep output portable to Next.js/Vue: no framework-specific markup or runtime coupling
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns; preserve Spanish UI copy during migration
    tdd: false # keep in sync with top-level strict_tdd
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
